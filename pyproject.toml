[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-iwu"
version = "0.2.0a1"
description = "IWU-S20 reference implementation for verified inference work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "blackscaletech"}]
dependencies = []
keywords = ["AI evaluation", "inference", "measurement", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/blackscaletech/iwu"
Issues = "https://github.com/blackscaletech/iwu/issues"

[tool.setuptools]
py-modules = ["iwu"]
