name: IWU-S20 conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python conformance
        run: python -m unittest discover -s tests -v
      - name: Mathematical gates
        run: python tools/validate_math.py --check validation/MATH-RESULTS.json
      - name: Python cross-language fixture
        run: python tools/crosscheck_fixture.py --check validation/CROSS-LANGUAGE-RESULTS.json
      - name: Repository publication audit
        run: python tools/check_repository.py

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JavaScript conformance
        run: node --test tests/test_iwu.mjs
      - name: JavaScript cross-language fixture
        run: node tools/crosscheck.mjs --check validation/CROSS-LANGUAGE-RESULTS.json
