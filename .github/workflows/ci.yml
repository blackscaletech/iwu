name: Research CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional verification dependencies
        run: python -m pip install -e '.[analysis,qa]'
      - name: Conformance tests
        run: python -m unittest discover -s tests -v
      - name: Check release boundary and history
        run: python tools/check_release.py --history
      - name: Release scanner negative controls
        run: python tools/test_release_guard.py
      - name: Verify recorded answers and examples
        run: python tools/check_recorded_evidence.py
      - name: Run example
        run: python scripts/example.py
